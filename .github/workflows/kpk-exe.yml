name: KPK EXE

on:
  push:
    branches:
      - main
    paths:
      - "KiloLedger/KiloLedger/**"
      - "build/cf35/**"
      - "build/build-kpk.ps1"
      - "VERSION"
      - ".github/workflows/kpk-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpk-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read version
        id: ver
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build KPK Release
        shell: pwsh
        run: |
          ./build/build-kpk.ps1 -Configuration Release

      - name: Publish to dist/download and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:APP_VERSION
          if (-not $version) { throw "VERSION is empty" }
          $exeName = "KiloLedger-$version-KPK.exe"
          $zipName = "KiloLedger-$version-KPK.zip"

          $exe = "KiloLedger/KiloLedger/bin/Release/KiloLedger.exe"
          if (-not (Test-Path $exe)) { throw "KPK exe not found" }

          New-Item -ItemType Directory -Path dist/download, dist/KiloLedger-KPK -Force | Out-Null
          Copy-Item $exe "dist/download/$exeName" -Force
          Copy-Item $exe "dist/KiloLedger-KPK/KiloLedger.exe" -Force

          # Drop obj dirt so rebase/push is clean; keep freshly built exe for bin/.
          git checkout -- "KiloLedger/KiloLedger/obj" 2>$null
          git clean -fd "KiloLedger/KiloLedger/obj" 2>$null
          Copy-Item "dist/download/$exeName" "KiloLedger/KiloLedger/bin/Release/KiloLedger.exe" -Force

          $cab = "build/cf35/NETCFv35.wm.armv4i.cab"
          if (Test-Path $cab) {
            Copy-Item $cab "dist/KiloLedger-KPK/NETCFv35.wm.armv4i.cab" -Force
          }

          if (Test-Path "dist/KiloLedger-KPK.zip") { Remove-Item "dist/KiloLedger-KPK.zip" -Force }
          Compress-Archive -Path "dist/KiloLedger-KPK/*" -DestinationPath "dist/KiloLedger-KPK.zip" -Force
          Copy-Item "dist/KiloLedger-KPK.zip" "dist/download/$zipName" -Force

          # Remove old unversioned + other versioned KPK download assets.
          Get-ChildItem dist/download -File | Where-Object {
            $_.Name -ne $exeName -and $_.Name -ne $zipName -and (
              $_.Name -eq "Alfa156-KPK.exe" -or
              $_.Name -eq "Alfa156-KPK.zip" -or
              $_.Name -eq "KiloLedger-KPK.exe" -or
              $_.Name -eq "KiloLedger-KPK.zip" -or
              $_.Name -match '^(Alfa156|KiloLedger)-.+-KPK\.(exe|zip)$'
            )
          } | Remove-Item -Force

          # Recreate rolling release so Releases shows today's date (upload --clobber does not).
          $releaseExe = Join-Path $env:RUNNER_TEMP $exeName
          $releaseZip = Join-Path $env:RUNNER_TEMP $zipName
          Copy-Item "dist/download/$exeName" $releaseExe -Force
          Copy-Item "dist/download/$zipName" $releaseZip -Force
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view kpk-latest *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap
          if ($releaseExists) {
            gh release delete kpk-latest --yes --cleanup-tag
          }
          gh release create kpk-latest $releaseExe $releaseZip `
            --title "KiloLedger $version — KPK" `
            --notes "Automatically updated KPK build $version (run #${{ github.run_number }})." `
            --target $env:GITHUB_SHA `
            --latest=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/download/$exeName" "dist/download/$zipName" dist/KiloLedger-KPK/KiloLedger.exe dist/KiloLedger-KPK.zip KiloLedger/KiloLedger/bin/Release/KiloLedger.exe
          git add -u dist/download
          if (Test-Path "dist/KiloLedger-KPK/NETCFv35.wm.armv4i.cab") { git add dist/KiloLedger-KPK/NETCFv35.wm.armv4i.cab }
          if (Test-Path "dist/KiloLedger-KPK/README-KPK.txt") { git add dist/KiloLedger-KPK/README-KPK.txt }

          if (git diff --cached --quiet) {
            Write-Host "KPK exe unchanged"
            exit 0
          }

          git commit -m "Update $exeName in dist/download (build #${{ github.run_number }})."
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin main
            git merge --no-edit origin/main *> $null
            if ($LASTEXITCODE -ne 0) {
              git rev-parse -q --verify MERGE_HEAD *> $null
              if ($LASTEXITCODE -eq 0) { git merge --abort *> $null }
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "push retry $i"
            Start-Sleep -Seconds (3 * $i)
          }
          throw "git push failed"
