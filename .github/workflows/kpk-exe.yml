name: KPK EXE

on:
  push:
    branches:
      - main
    paths:
      - "Alfa156/Alfa156/**"
      - "build/cf35/**"
      - "build/build-kpk.ps1"
      - ".github/workflows/kpk-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpk-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build KPK Release
        shell: pwsh
        run: |
          ./build/build-kpk.ps1 -Configuration Release

      - name: Publish to dist/download and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "Alfa156/Alfa156/bin/Release/Alfa156.exe"
          if (-not (Test-Path $exe)) { throw "KPK exe not found" }

          New-Item -ItemType Directory -Path dist/download, dist/Alfa156-KPK -Force | Out-Null
          Copy-Item $exe "dist/download/Alfa156-KPK.exe" -Force
          Copy-Item $exe "dist/Alfa156-KPK/Alfa156.exe" -Force

          # Drop obj dirt so rebase/push is clean; keep freshly built exe for bin/.
          git checkout -- "Alfa156/Alfa156/obj" 2>$null
          git clean -fd "Alfa156/Alfa156/obj" 2>$null
          Copy-Item "dist/download/Alfa156-KPK.exe" "Alfa156/Alfa156/bin/Release/Alfa156.exe" -Force

          $cab = "build/cf35/NETCFv35.wm.armv4i.cab"
          if (Test-Path $cab) {
            Copy-Item $cab "dist/Alfa156-KPK/NETCFv35.wm.armv4i.cab" -Force
          }

          if (Test-Path "dist/Alfa156-KPK.zip") { Remove-Item "dist/Alfa156-KPK.zip" -Force }
          Compress-Archive -Path "dist/Alfa156-KPK/*" -DestinationPath "dist/Alfa156-KPK.zip" -Force
          Copy-Item "dist/Alfa156-KPK.zip" "dist/download/Alfa156-KPK.zip" -Force

          # Recreate rolling release so Releases shows today's date (upload --clobber does not).
          $releaseExe = Join-Path $env:RUNNER_TEMP "Alfa156-KPK.exe"
          $releaseZip = Join-Path $env:RUNNER_TEMP "Alfa156-KPK.zip"
          Copy-Item "dist/download/Alfa156-KPK.exe" $releaseExe -Force
          Copy-Item "dist/download/Alfa156-KPK.zip" $releaseZip -Force
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view kpk-latest *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap
          if ($releaseExists) {
            gh release delete kpk-latest --yes --cleanup-tag
          }
          gh release create kpk-latest $releaseExe $releaseZip `
            --title "Latest KPK EXE" `
            --notes "Automatically updated KPK build (run #${{ github.run_number }})." `
            --target $env:GITHUB_SHA `
            --latest=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/download/Alfa156-KPK.exe dist/download/Alfa156-KPK.zip dist/Alfa156-KPK/Alfa156.exe dist/Alfa156-KPK.zip Alfa156/Alfa156/bin/Release/Alfa156.exe
          if (Test-Path "dist/Alfa156-KPK/NETCFv35.wm.armv4i.cab") { git add dist/Alfa156-KPK/NETCFv35.wm.armv4i.cab }
          if (Test-Path "dist/Alfa156-KPK/README-KPK.txt") { git add dist/Alfa156-KPK/README-KPK.txt }

          if (git diff --cached --quiet) {
            Write-Host "KPK exe unchanged"
            exit 0
          }

          git commit -m "Update Alfa156-KPK.exe in dist/download (build #${{ github.run_number }})."
          for ($i = 1; $i -le 5; $i++) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "git pull --rebase failed" }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "push retry $i"
            Start-Sleep -Seconds (3 * $i)
          }
          throw "git push failed"
