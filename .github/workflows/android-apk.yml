name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - "Alfa156.Android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          sdk_path="$(command -v sdkmanager || true)"
          if [ -z "$sdk_path" ]; then
            sdk_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$sdk_path" ]; then
            sdk_path="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [ ! -x "$sdk_path" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          # yes завершается SIGPIPE после принятия лицензий — это ожидаемо.
          yes | "$sdk_path" --licenses >/dev/null || true
          set -o pipefail

      - name: Install Android workload
        run: dotnet workload install android

      - name: Set Android version code
        id: android-version
        run: echo "version_code=$((GITHUB_RUN_NUMBER + 4))" >> "$GITHUB_OUTPUT"

      - name: Install Android build dependencies
        run: >-
          dotnet build Alfa156.Android/Alfa156.Android.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build ARM64 APK
        run: >-
          dotnet build Alfa156.Android/Alfa156.Android.csproj
          -c Release
          -p:RuntimeIdentifier=android-arm64
          -p:ApplicationVersion=${{ steps.android-version.outputs.version_code }}
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$RUNNER_TEMP/Alfa156.apk"
          signed="$(find Alfa156.Android/bin/Release -name '*-Signed.apk' | head -n 1)"
          if [ -z "$signed" ]; then
            echo "Signed APK not found" >&2
            find Alfa156.Android/bin/Release -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp "$signed" "$apk_path"

          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$apk_path" --clobber
          else
            gh release create android-latest "$apk_path" \
              --title "Latest Android APK" \
              --notes "Automatically updated Android ARM64 build." \
              --target "$GITHUB_SHA"
          fi

      - name: Commit APK to dist/download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signed="$(find Alfa156.Android/bin/Release -name '*-Signed.apk' | head -n 1)"
          mkdir -p dist/download
          cp "$signed" dist/download/Alfa156.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/download/Alfa156.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Update Alfa156.apk in dist/download (build #${{ github.run_number }})."
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push retry $i"
            sleep $((3 * i))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
