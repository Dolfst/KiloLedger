name: Smoke verifies

on:
  push:
    branches:
      - main
    paths:
      - "KiloLedger/**"
      - "KiloLedger.Android/**"
      - "KiloLedger.Desktop/**"
      - "build/**"
      - "VERSION"
      - "README.md"
      - "README.ru.md"
      - "google-sync/**"
      - ".github/workflows/smoke-verifies.yml"
  pull_request:
    paths:
      - "KiloLedger/**"
      - "KiloLedger.Android/**"
      - "KiloLedger.Desktop/**"
      - "build/**"
      - "VERSION"
      - "README.md"
      - "README.ru.md"
      - "google-sync/**"
      - ".github/workflows/smoke-verifies.yml"
  workflow_dispatch:

concurrency:
  group: smoke-verifies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Mono CF build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes mono-devel nodejs

      - name: Run smoke verifies
        run: python3 build/run_verifies.py

      - name: Build KPK EXE
        run: ./build/build-kpk.sh Release
