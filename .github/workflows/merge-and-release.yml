name: Merge and release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark PR ready and merge into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 3 --repo "${{ github.repository }}" || true
          gh pr merge 3 --repo "${{ github.repository }}" --merge --admin --delete-branch=false
